<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EducaBem</title>
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet">
  <style>
    #educabem-chatbot-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1100;
      display: flex;
      width: 64px;
      height: 64px;
      align-items: center;
      justify-content: center;
      padding: 3px;
      overflow: hidden;
      border: 0;
      border-radius: 50%;
      background: #2e7d32;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    #educabem-chatbot-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #educabem-chatbot-window {
      position: fixed;
      right: 20px;
      bottom: 96px;
      z-index: 1100;
      display: none;
      width: min(360px, calc(100vw - 32px));
      height: min(460px, calc(100dvh - 120px));
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      color: #222;
      font-family: Arial, sans-serif;
    }
    #educabem-chatbot-header {
      display: flex;
      min-height: 56px;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      background: #2e7d32;
      color: #fff;
    }
    #educabem-chatbot-header img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      object-fit: contain;
    }
    #educabem-chatbot-close {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 26px;
    }
    #educabem-chatbot-messages {
      flex: 1;
      padding: 10px 14px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.45;
    }
    #educabem-chatbot-messages p {
      margin: 0 0 12px;
      overflow-wrap: anywhere;
    }
    #educabem-chatbot-form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }
    #educabem-chatbot-input {
      min-width: 0;
      flex: 1;
      padding: 9px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font: inherit;
    }
    #educabem-chatbot-form button {
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: #2e7d32;
      color: #fff;
      cursor: pointer;
      font: inherit;
    }
    #educabem-chatbot-button:focus-visible,
    #educabem-chatbot-close:focus-visible,
    #educabem-chatbot-input:focus-visible,
    #educabem-chatbot-form button:focus-visible {
      outline: 3px solid #f5c400;
      outline-offset: 2px;
    }
    @media (max-width: 480px) {
      #educabem-chatbot-button { right: 16px; bottom: 16px; }
      #educabem-chatbot-window { right: 16px; bottom: 88px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
  <button id="educabem-chatbot-button" type="button" aria-label="Abrir chatbot" aria-expanded="false">
    <img src="./chatbot.png" alt="">
  </button>
  <section id="educabem-chatbot-window" aria-label="Chat Educabem">
    <header id="educabem-chatbot-header">
      <img src="./chatbot.png" alt="">
      <strong>Educabem</strong>
      <button id="educabem-chatbot-close" type="button" aria-label="Fechar chatbot">×</button>
    </header>
    <div id="educabem-chatbot-messages" aria-live="polite">
      <p><strong>Educabem:</strong> Olá! Como posso ajudar?</p>
    </div>
    <form id="educabem-chatbot-form">
      <input id="educabem-chatbot-input" type="text" placeholder="Digite sua mensagem..." aria-label="Mensagem" autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
  </section>
  <script>
    (() => {
      const button = document.getElementById('educabem-chatbot-button');
      const chatbotWindow = document.getElementById('educabem-chatbot-window');
      const closeButton = document.getElementById('educabem-chatbot-close');
      const form = document.getElementById('educabem-chatbot-form');
      const input = document.getElementById('educabem-chatbot-input');
      const messages = document.getElementById('educabem-chatbot-messages');

      const respostas = [
        {
          termos: ['doar livro', 'doacao de livro', 'doar livros'],
          texto: 'Que legal querer ajudar! Você pode doar livros didáticos, de literatura, gibis e paradidáticos em bom estado. Acesse a seção "Doar Livros" no menu para começar.'
        },
        {
          termos: ['tipo de livro', 'tipos de livro', 'livros aceitos', 'aceitam livro'],
          texto: 'Aceitamos livros de literatura infantil, juvenil e adulta, apostilas e livros didáticos atualizados, além de obras de negócios e finanças. Pedimos que estejam em bom estado, sem páginas rasgadas, mofadas ou ilegíveis.'
        },
        {
          termos: ['receber livro', 'pedir livro', 'livro emprestado', 'livros doados', 'catalogo'],
          texto: 'Para buscar livros para leitura ou apoio nos estudos, acesse a seção "Doar Livros" no menu e confira as opções disponíveis.'
        },
        {
          termos: ['curso de financa', 'conteudo de financa', 'educacao financeira', 'financas gratis'],
          texto: 'O EducaBem oferece conteúdos e trilhas de educação financeira para ajudar você a organizar o orçamento, sair das dívidas e planejar o futuro.'
        },
        {
          termos: ['organizar meu dinheiro', 'organizar o dinheiro', 'comecar a organizar', 'controle financeiro'],
          texto: 'O primeiro passo é registrar todas as entradas e saídas por pelo menos 30 dias. Assim você entende seus hábitos e pode planejar seu orçamento.'
        },
        {
          termos: ['sair das dividas', 'sair da divida', 'negociar divida', 'endividamento'],
          texto: 'Acesse a Trilha no menu para encontrar conteúdos sobre organização financeira, negociação de dívidas e planejamento.'
        },
        {
          termos: ['ong parceira', 'ongs parceiras', 'ongs', 'organizacoes parceiras'],
          texto: 'Conheça nossas organizações parceiras na seção "ONGs Parceiras" do menu.'
        },
        {
          termos: ['o que e o educabem', 'sobre o educabem', 'quem e o educabem'],
          texto: 'O EducaBem promove educação financeira e ações de impacto social, incluindo o incentivo à leitura e a parceria com organizações.'
        },
        {
          termos: ['voluntario', 'voluntariado', 'parceiro', 'ponto de coleta'],
          texto: 'Toda ajuda é bem-vinda! Confira as opções de apoio e as ONGs parceiras nas seções correspondentes do menu.'
        },
        {
          termos: ['ola', 'oi', 'bom dia', 'boa tarde', 'boa noite'],
          texto: 'Olá! Posso ajudar com doação de livros, educação financeira, ONGs parceiras ou informações sobre o EducaBem.'
        },
        {
          termos: ['obrigado', 'obrigada', 'valeu'],
          texto: 'Por nada! Estou aqui para ajudar.'
        }
      ];

      const normalizar = (texto) =>
        texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

      const encontrarResposta = (pergunta) => {
        const perguntaNormalizada = normalizar(pergunta);
        const resposta = respostas.find((item) =>
          item.termos.some((termo) => perguntaNormalizada.includes(normalizar(termo)))
        );
        return resposta
          ? resposta.texto
          : 'Ainda não encontrei uma resposta. Tente perguntar sobre doação de livros, educação financeira, ONGs parceiras ou sobre o EducaBem.';
      };

      const adicionarMensagem = (remetente, texto) => {
        const paragrafo = document.createElement('p');
        const nome = document.createElement('strong');
        nome.textContent = `${remetente}: `;
        paragrafo.append(nome, document.createTextNode(texto));
        messages.appendChild(paragrafo);
      };

      button.addEventListener('click', () => {
        const aberto = chatbotWindow.style.display !== 'flex';
        chatbotWindow.style.display = aberto ? 'flex' : 'none';
        button.setAttribute('aria-expanded', String(aberto));
        if (aberto) input.focus();
      });

      closeButton.addEventListener('click', () => {
        chatbotWindow.style.display = 'none';
        button.setAttribute('aria-expanded', 'false');
        button.focus();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && chatbotWindow.style.display === 'flex') {
          chatbotWindow.style.display = 'none';
          button.setAttribute('aria-expanded', 'false');
          button.focus();
        }
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const pergunta = input.value.trim();
        if (!pergunta) return;

        adicionarMensagem('Você', pergunta);
        adicionarMensagem('Educabem', encontrarResposta(pergunta));
        input.value = '';
        messages.scrollTop = messages.scrollHeight;
      });
    })();
  </script>
</body>
</html>
